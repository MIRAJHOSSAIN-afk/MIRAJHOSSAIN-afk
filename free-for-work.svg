<svg xmlns="http://www.w3.org/2000/svg" width="600" height="110" viewBox="0 0 600 110" role="img" aria-labelledby="title desc">
  <title id="title">Free for work</title>
  <desc id="desc">Animated neon badge reading free for work</desc>
  <defs>
    <linearGradient id="border" x1="0" x2="1">
      <stop offset="0" stop-color="#00fff0"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff00c8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="110" rx="18" fill="url(#border)"/>
  <rect x="7" y="7" width="586" height="96" rx="13" fill="#0a0a14"/>
  <circle cx="52" cy="55" r="12" fill="#39ff14" filter="url(#glow)">
    <animate attributeName="r" values="10;14;10" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.65;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="97" y="66" fill="#00fff0" font-family="monospace" font-size="34" font-weight="700" filter="url(#glow)">#FREE_FOR_WORK</text>
  <rect x="492" y="34" width="18" height="42" fill="#39ff14">
    <animate attributeName="opacity" values="1;.25;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
